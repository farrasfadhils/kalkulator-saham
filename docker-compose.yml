services:
  postgres:
    image: postgres:16-alpine
    container_name: ${APP_NAME:?APP_NAME is required}-postgres
    restart: unless-stopped
    cpus: "${DB_CPUS:-1.0}"
    mem_limit: "${DB_MEMORY_LIMIT:-512m}"
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - kalkulator-network

  app:
    image: ghcr.io/${OWNER_LC:?OWNER_LC is required}/kalkulator-saham:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: ${APP_NAME:?APP_NAME is required}-app
    restart: unless-stopped
    init: true
    cpus: "${APP_CPUS:-1.0}"
    mem_limit: "${APP_MEMORY_LIMIT:-768m}"
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      DATABASE_URL: postgresql://${DB_USER:?DB_USER is required}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:?DB_NAME is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    # Kept only so the one-time migration can read and remove legacy files.
    # The application no longer writes article media to this volume.
    volumes:
      - article_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - kalkulator-network
      - proxy-network

networks:
  kalkulator-network:
    driver: bridge
    internal: true
  proxy-network:
    external: true

volumes:
  postgres_data:
  article_uploads:
