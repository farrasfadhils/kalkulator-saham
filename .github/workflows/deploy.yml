name: Build and deploy

on:
  push:
    branches: [main, production, staging]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Create GitHub Environments named "staging" and "production" and put
    # environment-specific secrets/variables there.
    environment: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set deployment metadata
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "staging" ]]; then
            echo "APP_NAME=kalkulator-saham-staging" >> "$GITHUB_ENV"
          else
            echo "APP_NAME=kalkulator-saham-production" >> "$GITHUB_ENV"
          fi
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          tags: ghcr.io/${{ env.OWNER_LC }}/kalkulator-saham:${{ env.IMAGE_TAG }}

      - name: Copy Compose definition to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml
          target: ../apps/${{ env.APP_NAME }}/

      - name: Deploy and verify VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_NAME: ${{ env.APP_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          OWNER_LC: ${{ env.OWNER_LC }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          DB_USER: ${{ vars.DB_USER }}
          DB_NAME: ${{ vars.DB_NAME }}
          APP_PORT: ${{ vars.APP_PORT }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME || secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME || secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY || vars.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET || vars.CLOUDINARY_API_SECRET }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL || vars.CLOUDINARY_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_NAME,IMAGE_TAG,OWNER_LC,GHCR_PAT,GHCR_USERNAME,DB_USER,DB_NAME,APP_PORT,DB_PASSWORD,SESSION_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME,CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_API_SECRET,CLOUDINARY_URL
          script: |
            set -eu
            umask 077
            mkdir -p "../apps/$APP_NAME"
            cd "../apps/$APP_NAME"
            printf 'APP_NAME=%s\nIMAGE_TAG=%s\nOWNER_LC=%s\nDB_USER=%s\nDB_NAME=%s\nAPP_PORT=%s\nDB_PASSWORD=%s\nSESSION_SECRET=%s\nGOOGLE_CLIENT_ID=%s\nGOOGLE_CLIENT_SECRET=%s\nNEXT_PUBLIC_APP_URL=%s\nNEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=%s\nCLOUDINARY_CLOUD_NAME=%s\nCLOUDINARY_API_KEY=%s\nCLOUDINARY_API_SECRET=%s\nCLOUDINARY_URL=%s\n' \
              "$APP_NAME" "$IMAGE_TAG" "$OWNER_LC" "$DB_USER" "$DB_NAME" "$APP_PORT" "$DB_PASSWORD" "$SESSION_SECRET" "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" "$NEXT_PUBLIC_APP_URL" "${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:-}" "${CLOUDINARY_CLOUD_NAME:-}" "${CLOUDINARY_API_KEY:-}" "${CLOUDINARY_API_SECRET:-}" "${CLOUDINARY_URL:-}" > .env
            printf '%s' "$GHCR_PAT" | sudo docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            sudo docker compose -p "$APP_NAME" pull app
            sudo docker compose -p "$APP_NAME" up -d --wait postgres
            sudo docker compose -p "$APP_NAME" run --rm app prisma migrate deploy
            sudo docker compose -p "$APP_NAME" run --rm app node scripts/migrate-article-media-to-cloudinary.mjs
            sudo docker compose -p "$APP_NAME" up -d --no-deps app
            sudo docker compose -p "$APP_NAME" ps
